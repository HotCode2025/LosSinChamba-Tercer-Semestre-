<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Leyenda de Aang: Avatar</title>

    <!-- Tipografías: Cinzel para títulos (epic), Outfit para el cuerpo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="./avatar.css">
</head>
<body>
    <h1>AVATAR 🔥 💧 🌱 🌪</h1>

    <!-- Selección de personaje -->
    <section id="seleccionar-personaje">
        <h2>Elige tu Personaje</h2>
        <div class="personajes">
            <label class="personaje-card" for="zuko">
                <span class="emoji">🔥</span>
                <input type="radio" name="personaje" id="zuko" />
                <span class="nombre">Zuko</span>
            </label>
            <label class="personaje-card" for="katara">
                <span class="emoji">💧</span>
                <input type="radio" name="personaje" id="katara" />
                <span class="nombre">Katara</span>
            </label>
            <label class="personaje-card" for="aang">
                <span class="emoji">🌪️</span>
                <input type="radio" name="personaje" id="aang" />
                <span class="nombre">Aang</span>
            </label>
            <label class="personaje-card" for="toph">
                <span class="emoji">🌱</span>
                <input type="radio" name="personaje" id="toph" />
                <span class="nombre">Toph</span>
            </label>
        </div>
        <button id="boton-personaje">Seleccionar</button>
    </section>

    <!-- Selección de ataque (oculto hasta elegir personaje) -->
    <section id="seleccionar-ataque" class="oculto">
        <h2>Elige tu Ataque</h2>

        <!-- Contenedor del enemigo -->
        <div id="contenedor-enemigo"></div>

        <div class="vidas">
            <div class="vida-box">
                <div class="label">Tu personaje</div>
                <div class="valor"><span id="nombre-jugador">—</span></div>
                <div class="label" style="margin-top:0.4rem;">Vidas: <span id="vidas-jugador">3</span></div>
            </div>
            <div class="vida-box">
                <div class="label">Enemigo</div>
                <div class="valor"><span id="nombre-enemigo">—</span></div>
                <div class="label" style="margin-top:0.4rem;">Vidas: <span id="vidas-enemigo">3</span></div>
            </div>
        </div>

        <div class="ataques">
            <button id="boton-fuego">Fuego 🔥</button>
            <button id="boton-agua">Agua 💧</button>
            <button id="boton-tierra">Tierra 🌱</button>
            <button id="boton-aire">Aire 🌪️</button>
        </div>
    </section>

    <!-- Mensajes del combate -->
    <section id="mensajes" class="oculto">
        <h2>Combate</h2>
        <div id="contenedor-mensajes"></div>
    </section>

    <!-- Reiniciar -->
    <section id="reiniciar" class="oculto">
        <button id="boton-reiniciar">Reiniciar Combate</button>
    </section>

    <script src="./avatar.js"></script>
</body>
</html>
